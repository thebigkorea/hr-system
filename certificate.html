<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>재직증명서</title>

  <link rel="stylesheet" href="certificate.css">
</head>

<body>

  <div class="container">

    <div class="top-area">
      <h1>재직증명서</h1>
      <p>Certificate of Employment</p>
    </div>

    <div class="form-box">

      <label>직원 이름</label>
      <input type="text" id="name" placeholder="이름 입력">

      <label>주민번호 뒤 4자리</label>
      <input type="password" id="ssn" placeholder="뒤 4자리 입력">

      <label>제출 용도</label>
      <input type="text" id="purpose" placeholder="예: 통신사 제출용">

      <button onclick="createCertificate()">
        재직증명서 출력
      </button>

    </div>

    <div class="preview-box" id="preview">

      <div class="paper">

        <h2>재 직 증 명 서</h2>

        <table>

          <tr>
            <th>성 명</th>
            <td id="previewName">박상신</td>
          </tr>

          <tr>
            <th>소 속</th>
            <td>한국의집 롯데월드몰점</td>
          </tr>

          <tr>
            <th>직 위</th>
            <td>이사</td>
          </tr>

          <tr>
            <th>근무기간</th>
            <td>2025-04-01 ~ 현재</td>
          </tr>

          <tr>
            <th>용 도</th>
            <td id="previewPurpose">통신사 제출용</td>
          </tr>

        </table>

        <div class="bottom-text">

          위와 같이 증명합니다.<br><br>

          2026년 05월 08일

          <br><br><br>

          주식회사 더큰코리아<br>
          대표이사 박병호

        </div>

      </div>

    </div>

  </div>

  <script src="certificate.js"></script>

</body>
</html>
