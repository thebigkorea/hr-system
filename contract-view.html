<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>전자근로계약 완료본</title>

  <meta id="ogTitle" property="og:title" content="전자근로계약 완료본">
  <meta id="ogDesc" property="og:description" content="더큰코리아 전자근로계약 시스템">
  <meta id="ogImage" property="og:image" content="https://thebigkorea.github.io/hr-system/contract-thumb.jpg">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://thebigkorea.github.io/hr-system/contract-view.html">

  <link rel="stylesheet" href="contract-view.css">

  <style>
    body{margin:0;background:#f3f5f9;font-family:'Pretendard','Noto Sans KR',sans-serif;color:#222}
    .loading{width:100%;height:100vh;display:flex;justify-content:center;align-items:center;font-size:22px;font-weight:700;color:#1f3f75}
    .contract-wrap{max-width:1100px;margin:40px auto;background:#fff;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.08);overflow:hidden}
    .top-area{background:#1f3f75;color:#fff;padding:50px 30px;text-align:center}
    .top-area h1{margin:0;font-size:54px;letter-spacing:10px;font-weight:900}
    .top-area p{margin-top:16px;font-size:20px;opacity:.9}
    .content{padding:50px;line-height:1.9;font-size:21px}
    .section-title{font-size:32px;font-weight:900;margin-top:60px;margin-bottom:24px;color:#1f3f75;border-left:8px solid #1f3f75;padding-left:16px}
    .contract-table{width:100%;border-collapse:collapse;margin-top:24px;margin-bottom:40px}
    .contract-table th{background:#1f3f75;color:#fff;padding:18px;font-size:20px;border:1px solid #d9dee7}
    .contract-table td{padding:18px;border:1px solid #d9dee7;text-align:center;font-size:20px}
    .total-row{background:#f2f5fa;font-weight:900}
    .sign-area{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:80px}
    .sign-box{border:2px solid #d9dee7;border-radius:20px;padding:30px;min-height:420px}
    .sign-box h3{margin-top:0;margin-bottom:24px;color:#1f3f75;font-size:34px}
    .sign-box p{margin:16px 0;font-size:21px}
    .company-seal{width:170px;margin-top:20px}
    .signature-img{width:260px;margin-top:20px;border-bottom:3px solid #222}
    .bottom-buttons{display:flex;gap:20px;margin-top:60px;flex-wrap:wrap}
    .btn{flex:1;min-width:240px;height:68px;border:none;border-radius:16px;font-size:22px;font-weight:800;cursor:pointer;transition:.2s}
    .btn-print{background:#1f3f75;color:#fff}
    @media(max-width:768px){.content{padding:28px;font-size:18px}.top-area h1{font-size:38px;letter-spacing:4px}.section-title{font-size:26px}.contract-table th,.contract-table td{font-size:16px;padding:12px}.sign-area{grid-template-columns:1fr}.sign-box{min-height:auto}.btn{width:100%}}
    @media print{body{background:#fff}.contract-wrap{box-shadow:none;margin:0;border-radius:0}.bottom-buttons{display:none}}
  </style>
</head>

<body>

<div id="loading" class="loading">
  계약서 불러오는 중...
</div>

<div id="contractWrap" class="contract-wrap" style="display:none;">
  <div class="top-area">
    <h1 id="viewTitle">근 로 계 약 서</h1>
    <p>Electronic Employment Contract</p>
  </div>

  <div class="content" id="contractContent"></div>
</div>

<script src="contract-view.js"></script>
</body>
</html>
