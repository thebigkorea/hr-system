<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인사관리대장</title>
  <link rel="stylesheet" href="hr-list.css">
</head>

<body>
<div class="container">

  <div class="top-area">
    <h1>인사관리대장</h1>
    <p>HR Employee Management</p>
  </div>

  <div class="search-area">

    <select id="deptFilter">
      <option value="all">전체 매장</option>
    </select>

    <select id="statusFilter">
      <option value="all">전체 상태</option>
      <option value="재직중">재직중</option>
      <option value="재직">재직</option>
      <option value="퇴사">퇴사</option>
      <option value="퇴사자">퇴사자</option>
    </select>

    <input
      type="text"
      id="searchInput"
      placeholder="특정 직원명 검색"
    >

    <button class="search-btn" onclick="searchEmployee()">조회</button>
    <button class="reset-btn" onclick="resetSearch()">초기화</button>

  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>사번</th>
          <th>이름</th>
          <th>소속</th>
          <th>직위</th>
          <th>연락처</th>
          <th>입사일</th>
          <th>퇴사일</th>
          <th>상태</th>
          <th>문서</th>
        </tr>
      </thead>

      <tbody id="employeeTableBody">
        <tr>
          <td colspan="9">조회 조건을 선택한 뒤 조회 버튼을 눌러주세요.</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<script src="hr-list.js"></script>
</body>
</html>
