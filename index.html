<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>한국의집 인사관리시스템</title>

  <link rel="stylesheet" href="style.css" />

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Pretendard','Noto Sans KR',sans-serif;
    }

    body{
      background:#f2f4f7;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:flex-start;
      padding:50px 20px;
    }

    .container{
      width:100%;
      max-width:700px;
    }

    .header{
      text-align:center;
      margin-bottom:40px;
    }

    .header h1{
      font-size:52px;
      color:#183153;
      font-weight:800;
      margin-bottom:10px;
    }

    .header p{
      font-size:22px;
      color:#6b7280;
    }

    .menu{
      display:flex;
      flex-direction:column;
      gap:24px;
    }

    .menu-link{
      width:100%;
      text-decoration:none;
      display:block;
    }

    .menu-btn{
      width:100%;
      border:none;
      border-radius:26px;
      background:#1f3d68;
      color:white;
      padding:34px 20px;
      font-size:34px;
      font-weight:700;
      cursor:pointer;
      transition:0.2s;
      box-shadow:0 8px 24px rgba(0,0,0,0.12);
    }

    .menu-btn:hover{
      background:#295287;
      transform:translateY(-2px);
    }

    .menu-btn:active{
      transform:scale(0.98);
    }

    @media(max-width:768px){

      body{
        padding:30px 16px;
      }

      .header h1{
        font-size:34px;
        line-height:1.3;
      }

      .header p{
        font-size:18px;
      }

      .menu{
        gap:18px;
      }

      .menu-btn{
        font-size:26px;
        padding:28px 16px;
        border-radius:20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>한국의집 인사관리시스템</h1>
      <p>Human Resource Management</p>
    </div>

    <div class="menu">

      <a href="certificate.html" class="menu-link">
        <button class="menu-btn">
          📄 재직증명서
        </button>
      </a>

      <a href="career.html" class="menu-link">
        <button class="menu-btn">
          🧾 경력증명서
        </button>
      </a>

      <a href="employee-card.html" class="menu-link">
        <button class="menu-btn">
          👤 인사카드
        </button>
      </a>

      <a href="hr-list.html" class="menu-link">
        <button class="menu-btn">
          📋 인사관리대장
        </button>
      </a>

    </div>

  </div>

</body>
</html>
