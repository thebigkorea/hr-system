<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>퇴직자 조회</title>

  <link rel="stylesheet"
        href="retirement-list.css">
</head>

<body>

<div class="wrap">

  <div class="header">

    <h1>퇴직자 조회</h1>

    <p>
      퇴직서 현황 및
      전자서명 상태를 관리합니다.
    </p>

  </div>

  <div class="card">

    <div class="row">

      <div>

        <label>점포</label>

        <select id="searchStore">

          <option value="">
            전체
          </option>

          <option>
            더큰코리아 본사
          </option>

          <option>
            한국의집 롯데월드몰점
          </option>

          <option>
            한국의집 효종갱 파주아울렛점
          </option>

          <option>
            소바공방 평촌점
          </option>

          <option>
            길채정 압구정점
          </option>

          <option>
            고궁 부여점
          </option>

          <option>
            카페그랑떼 부여점
          </option>

        </select>

      </div>

      <div>

        <label>퇴직유형</label>

        <select id="searchType">

          <option value="">
            전체
          </option>

          <option>
            자진사직
          </option>

          <option>
            권고사직
          </option>

          <option>
            계약만료
          </option>

          <option>
            기타
          </option>

        </select>

      </div>

    </div>

    <button class="btn primary"
            onclick="loadRetirementList()">

      조회하기

    </button>

  </div>

  <div class="card">

    <h2>퇴직 현황</h2>

    <div id="retirementList">

      불러오는 중...

    </div>

  </div>

</div>

<script src="retirement-list.js"></script>

</body>
</html>
