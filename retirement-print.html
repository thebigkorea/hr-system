<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="퇴직서 서명 완료본">
  <meta property="og:description" content="퇴직서 전자서명이 완료되었습니다.">
  <meta property="og:image" content="https://thebigkorea.github.io/hr-system/images/retirement-complete-thumb.jpg">
  <meta property="og:url" content="https://thebigkorea.github.io/hr-system/retirement-print.html">
  <meta property="og:type" content="website">      

  <title>퇴직서 출력</title>

  <link rel="stylesheet"
        href="retirement-print.css">
</head>

<body>

<div class="print-wrap">

  <div class="toolbar">
    <button onclick="window.print()">
  인쇄 / PDF 저장
</button>
  </div>

  <section class="paper">

    <h1>퇴 직 서</h1>

    <table>
      <tr>
        <th>퇴직번호</th>
        <td id="retireId"></td>
        <th>퇴직유형</th>
        <td id="type"></td>
      </tr>

      <tr>
        <th>점포</th>
        <td id="store"></td>
        <th>성명</th>
        <td id="name"></td>
      </tr>

      <tr>
        <th>직위</th>
        <td id="position"></td>
        <th>연락처</th>
        <td id="phone"></td>
      </tr>

      <tr>
        <th>입사일</th>
        <td id="joinDate"></td>
        <th>퇴직예정일</th>
        <td id="retireDate"></td>
      </tr>

      <tr>
        <th>등록일시</th>
        <td id="createdAt"></td>
        <th>서명일시</th>
        <td id="signedAt"></td>
      </tr>
    </table>

    <h2>퇴직사유</h2>

    <div id="reason"
         class="text-box"></div>

    <div class="confirm-text">
      본인은 위 퇴직 관련 내용을 충분히 확인하였으며,
      본인의 의사에 따라 전자서명하였음을 확인합니다.
    </div>

    <div class="sign-area">

      <div>
        <strong>근로자 전자서명</strong>
        <div class="sign-box">
          <img id="signature"
               alt="전자서명">
        </div>
      </div>

      <div class="company-box">
        <strong>회사 확인</strong>
        <p>
          주식회사 더큰코리아<br>
          담당자: <span id="manager"></span>
        </p>
      </div>

    </div>

  </section>

</div>

<script src="retirement-print.js"></script>

</body>
</html>
